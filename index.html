
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080817">
<title>NEW YEAR 2027 — TEAM ELITE FAMILY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #35104f, #080817 65%);
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-x: hidden;
  overflow-y: auto;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 1;
  padding: 24px 16px;
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

.tag {
  color: #ffd779;
  letter-spacing: 7px;
  font-size: 13px;
}

h1 {
  font-size: clamp(42px, 10vw, 100px);
  margin: 18px 0;
  background: linear-gradient(
    180deg,
    #fffde8 0%,
    #ffdf75 35%,
    #ffad32 65%,
    #fff0a0 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 18px #ffb52c55);
}

h2 {
  font-size: clamp(35px, 7vw, 65px);
  letter-spacing: 12px;
  color: #ff404f;
  margin: 0;
  text-shadow: 0 0 25px #ff304f66;
}

p {
  color: #e8dff7;
  letter-spacing: 2px;
  font-size: clamp(11px, 2vw, 15px);
}

.timer {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 32px 0;
}

.unit {
  background: #ffffff12;
  border: 1px solid #ffcf7055;
  border-radius: 15px;
  padding: 18px 12px;
  min-width: 85px;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 20px #ffcf7010;
}

.num {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: bold;
  color: #ffd779;
  text-shadow: 0 0 15px #ffbf4766;
}

.label {
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 8px;
  color: #ddd;
}

#message {
  font-size: clamp(15px, 3vw, 20px);
  color: #ffd779;
  margin-top: 20px;
}

/* TEAM ELITE FAMILY - DESAIN PREMIUM */
footer {
  margin-top: 38px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.team-name {
  display: inline-block;
  max-width: 100%;
  font-size: clamp(25px, 5.5vw, 48px);
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: clamp(1px, 0.7vw, 6px);
  text-transform: uppercase;

  background: linear-gradient(
    180deg,
    #fffde5 0%,
    #ffe9a0 18%,
    #ffc447 42%,
    #ff454f 68%,
    #ffb94a 85%,
    #fff1b3 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter:
    drop-shadow(0 0 5px #ffcc5555)
    drop-shadow(0 0 16px #ff304f55);

  animation: eliteGlow 3s ease-in-out infinite alternate;
}

.timezone {
  font-size: 12px;
  color: #f1dca9;
  letter-spacing: 4px;
  text-shadow: 0 0 12px #ffcf7044;
}

@keyframes eliteGlow {
  from {
    filter:
      drop-shadow(0 0 4px #ffcc5544)
      drop-shadow(0 0 10px #ff304f33);
  }
  to {
    filter:
      drop-shadow(0 0 9px #ffcc5599)
      drop-shadow(0 0 22px #ff304f77);
  }
}

@media (max-width: 480px) {
  .content {
    padding: 28px 12px;
  }

  .tag {
    font-size: 10px;
    letter-spacing: 4px;
  }

  .timer {
    gap: 8px;
    margin: 24px 0;
  }

  .unit {
    min-width: 70px;
    padding: 14px 9px;
    border-radius: 12px;
  }

  footer {
    margin-top: 30px;
  }

  .team-name {
    letter-spacing: 1px;
  }

  .timezone {
    font-size: 10px;
    letter-spacing: 3px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .team-name {
    animation: none;
  }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="content">

  <div class="tag">✦ THE GRAND CELEBRATION ✦</div>

  <h1>HAPPY NEW YEAR</h1>

  <h2>2027</h2>

  <p>COUNTDOWN TO A NEW BEGINNING</p>

  <div class="timer">
    <div class="unit">
      <div class="num" id="days">0</div>
      <div class="label">HARI</div>
    </div>

    <div class="unit">
      <div class="num" id="hours">00</div>
      <div class="label">JAM</div>
    </div>

    <div class="unit">
      <div class="num" id="minutes">00</div>
      <div class="label">MENIT</div>
    </div>

    <div class="unit">
      <div class="num" id="seconds">00</div>
      <div class="label">DETIK</div>
    </div>
  </div>

  <div id="message">Bersiap menyambut tahun baru!</div>

  <footer>
    <div class="team-name">✦ TEAM ELITE FAMILY ✦</div>
    <div class="timezone">WIB (UTC+7)</div>
  </footer>

</div>

<script>
const target = new Date("2027-01-01T00:00:00+07:00").getTime();

function update() {
  let diff = Math.max(0, target - Date.now());

  document.getElementById("days").textContent =
    Math.floor(diff / 86400000);

  document.getElementById("hours").textContent =
    String(Math.floor(diff / 3600000) % 24).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(Math.floor(diff / 60000) % 60).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(Math.floor(diff / 1000) % 60).padStart(2, "0");

  if (diff === 0) {
    document.getElementById("message").textContent =
      "🎉 SELAMAT TAHUN BARU 2027! 🎉";
  }
}

update();
setInterval(update, 1000);

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);

  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener("resize", resize);
resize();

function burst() {
  const x = Math.random() * innerWidth;
  const y = Math.random() * innerHeight * 0.65;
  const hue = Math.random() * 360;

  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;

    particles.push({
      x,
      y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 80 + Math.random() * 30,
      maxLife: 110,
      hue
    });
  }
}

function animate() {
  ctx.fillStyle = "rgba(8,8,23,0.18)";
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = `hsl(${p.hue},100%,65%)`;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

setInterval(burst, 650);

for (let i = 0; i < 5; i++) {
  setTimeout(burst, i * 300);
}

animate();
</script>

</body>
</html>
