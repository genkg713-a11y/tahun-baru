
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100719">
<title>NEW YEAR 2027 — TEAM ELITE FAMILY</title>

<style>
:root {
  --gold: #ffd778;
  --red: #ff303b;
  --white: #fff9ed;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  background: #100719;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
}

/* BACKGROUND GAMBAR: TIDAK DIPAKSA MEMENUHI LAYAR */
.background {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: #100719;
  background-image:
    linear-gradient(
      180deg,
      rgba(10, 3, 20, .28),
      rgba(10, 3, 20, .48)
    ),
    url("https://s15.gifyu.com/images/bWmeJ.jpg");
  background-repeat: no-repeat;
  background-position: center center;
  background-size: contain;
  pointer-events: none;
}

.background::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at center,
      transparent 15%,
      rgba(8, 3, 18, .32) 100%
    );
}

/* KEMBANG API */
#fireworks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* KONTEN UTAMA */
.page {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 18px;
}

.eyebrow {
  color: var(--gold);
  font-size: clamp(11px, 2vw, 14px);
  font-weight: bold;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 0 14px rgba(255, 204, 95, .7);
}

h1 {
  margin: 0;
  font-size: clamp(35px, 8vw, 82px);
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff4cb;
  text-shadow:
    0 0 12px rgba(255, 202, 91, .6),
    0 0 35px rgba(255, 53, 76, .4);
}

.year {
  display: block;
  margin-top: 4px;
  font-size: clamp(48px, 12vw, 118px);
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(
    180deg,
    #fff8d9 0%,
    #ffd66b 40%,
    #ff8b39 70%,
    #ff3548 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 18px rgba(255, 166, 59, .3));
}

.subtitle {
  margin: 18px 0 24px;
  font-size: clamp(12px, 2.5vw, 17px);
  letter-spacing: 3px;
  color: #fff4e5;
  text-shadow: 0 2px 8px #000;
}

/* HITUNG MUNDUR */
.countdown {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(7px, 2vw, 16px);
  width: min(100%, 600px);
}

.time-box {
  padding: clamp(12px, 3vw, 22px) 5px;
  border: 1px solid rgba(255, 216, 120, .65);
  border-radius: 14px;
  background: rgba(20, 7, 29, .67);
  box-shadow:
    0 0 18px rgba(255, 181, 65, .12),
    inset 0 0 16px rgba(255, 255, 255, .04);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.number {
  display: block;
  font-size: clamp(25px, 6vw, 49px);
  font-weight: 900;
  color: #fff0b8;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 14px rgba(255, 196, 82, .45);
}

.unit {
  display: block;
  margin-top: 5px;
  font-size: clamp(9px, 1.8vw, 12px);
  letter-spacing: 2px;
  color: #ffc9c9;
  font-weight: bold;
}

.target-date {
  margin-top: 18px;
  font-size: clamp(12px, 2.5vw, 16px);
  color: #fff5e5;
  text-shadow: 0 2px 8px #000;
}

.timezone {
  margin-top: 7px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--gold);
}

/* NAMA TEAM */
.team-name {
  margin-top: 32px;
  font-size: clamp(22px, 5vw, 43px);
  font-weight: 900;
  letter-spacing: clamp(1px, .6vw, 5px);
  line-height: 1.2;
  background: linear-gradient(
    90deg,
    #ff4545,
    #ffe19a,
    #ff4545
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 9px rgba(255, 65, 65, .5));
  overflow-wrap: anywhere;
}

.team-caption {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #fff0c9;
}

.footer {
  margin-top: 26px;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255, 255, 255, .8);
}

/* LAYAR HP */
@media (max-width: 480px) {
  .page {
    padding: 25px 14px;
  }

  .eyebrow {
    letter-spacing: 3px;
  }

  .subtitle {
    letter-spacing: 1.5px;
  }

  .countdown {
    gap: 6px;
  }

  .time-box {
    border-radius: 10px;
    padding: 12px 2px;
  }

  .unit {
    letter-spacing: 1px;
  }

  .team-name {
    margin-top: 27px;
    letter-spacing: 1px;
  }
}

@media (max-height: 650px) and (min-width: 481px) {
  .page {
    padding-top: 18px;
    padding-bottom: 18px;
  }

  .team-name {
    margin-top: 20px;
  }

  .footer {
    margin-top: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div class="background" aria-hidden="true"></div>
<canvas id="fireworks" aria-hidden="true"></canvas>

<main class="page">
  <div class="eyebrow">A New Beginning</div>

  <h1>
    HAPPY NEW YEAR
    <span class="year">2027</span>
  </h1>

  <div class="subtitle">WELCOME TO THE NEW CHAPTER</div>

  <section class="countdown" aria-label="Hitung mundur Tahun Baru">
    <div class="time-box">
      <span class="number" id="days">000</span>
      <span class="unit">HARI</span>
    </div>
    <div class="time-box">
      <span class="number" id="hours">00</span>
      <span class="unit">JAM</span>
    </div>
    <div class="time-box">
      <span class="number" id="minutes">00</span>
      <span class="unit">MENIT</span>
    </div>
    <div class="time-box">
      <span class="number" id="seconds">00</span>
      <span class="unit">DETIK</span>
    </div>
  </section>

  <div class="target-date">1 JANUARI 2027</div>
  <div class="timezone">00:00 WIB · GMT+7</div>

  <div class="team-name">TEAM ELITE FAMILY</div>
  <div class="team-caption">UNITED · STRONGER · FOREVER</div>

  <div class="footer">✦ CELEBRATE THE MOMENT ✦</div>
</main>

<script>
/* HITUNG MUNDUR KE 1 JANUARI 2027 PUKUL 00.00 WIB */
const targetDate = new Date("2027-01-01T00:00:00+07:00").getTime();

function updateCountdown() {
  const now = Date.now();
  let remaining = Math.max(0, targetDate - now);

  const days = Math.floor(remaining / 86400000);
  remaining %= 86400000;

  const hours = Math.floor(remaining / 3600000);
  remaining %= 3600000;

  const minutes = Math.floor(remaining / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(3, "0");
  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");

  if (now >= targetDate) {
    document.querySelector(".subtitle").textContent =
      "WELCOME TO 2027!";
  }
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* EFEK KEMBANG API */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let particles = [];
let lastLaunch = 0;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function launchFirework() {
  const x = width * (0.12 + Math.random() * 0.76);
  const y = height * (0.12 + Math.random() * 0.42);
  const hue = Math.floor(Math.random() * 360);
  const count = 35 + Math.floor(Math.random() * 25);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;

    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 45 + Math.random() * 30,
      maxLife: 75,
      hue: hue,
      size: 1 + Math.random() * 2
    });
  }
}

function animateFireworks(timestamp) {
  ctx.clearRect(0, 0, width, height);

  if (timestamp - lastLaunch > 950 + Math.random() * 800) {
    launchFirework();
    lastLaunch = timestamp;
  }

  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = "hsl(" + p.hue + ", 100%, 68%)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animateFireworks);
}

requestAnimationFrame(animateFireworks);
</script>

</body>
</html>
