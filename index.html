
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY NEW YEAR 2027 - TEAM ELITE FAMILY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: white;
            background: #100817;
        }

        /* BACKGROUND GAMBAR */
        .background {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url("https://s15.gifyu.com/images/bWmeJ.jpg");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            background-color: #100817;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: rgba(8, 3, 15, 0.08);
            pointer-events: none;
        }

        /* KEMBANG API */
        #fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* KONTEN UTAMA */
        .container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 35px 16px;
            gap: 28px;
        }

        /* HAPPY NEW YEAR */
        .main-title {
            position: relative;
            width: 100%;
            max-width: 100%;
            padding: 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(22px, 4.5vw, 54px);
            font-weight: 900;
            font-style: italic;
            line-height: 1.3;
            letter-spacing: 1px;
            color: rgba(255, 215, 0, 0.85);
            text-shadow:
                0 0 8px rgba(255, 215, 0, 0.6),
                0 0 20px rgba(255, 140, 0, 0.4);
            overflow-wrap: anywhere;
            animation: kedipNewYear 2.5s ease-in-out infinite;
        }

        @keyframes kedipNewYear {
            0%, 100% {
                opacity: 0.60;
                text-shadow:
                    0 0 5px rgba(255, 215, 0, 0.25),
                    0 0 10px rgba(255, 140, 0, 0.15);
            }

            50% {
                opacity: 1;
                text-shadow:
                    0 0 12px rgba(255, 215, 0, 0.95),
                    0 0 28px rgba(255, 140, 0, 0.8);
            }
        }

        /* COUNTDOWN */
        .countdown {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
            max-width: 900px;
        }

        .countdown-box {
            min-width: 125px;
            padding: 20px 14px;
            border: 1px solid rgba(255, 215, 0, 0.55);
            border-radius: 14px;
            background: rgba(20, 7, 29, 0.20);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            box-shadow: 0 0 12px rgba(255, 180, 0, 0.15);
            animation: glowBox 3s ease-in-out infinite;
        }

        @keyframes glowBox {
            0%, 100% {
                border-color: rgba(255, 215, 0, 0.35);
                box-shadow: 0 0 8px rgba(255, 180, 0, 0.1);
            }

            50% {
                border-color: rgba(255, 215, 0, 0.9);
                box-shadow: 0 0 18px rgba(255, 180, 0, 0.35);
            }
        }

        .countdown-number {
            display: block;
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 900;
            color: #ffd700;
            text-shadow:
                0 0 8px rgba(255, 215, 0, 0.7),
                0 0 18px rgba(255, 70, 0, 0.35);
            animation: kedipAngka 1.8s ease-in-out infinite;
        }

        #seconds {
            animation-duration: 0.9s;
        }

        @keyframes kedipAngka {
            0%, 100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .countdown-label {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* TEAM ELITE FAMILY */
        .team-title {
            font-size: clamp(20px, 4vw, 34px);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(
                90deg,
                #ff3030,
                #ffd700,
                #ffffff,
                #ff3030
            );
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                teamGradient 4s linear infinite,
                teamBlink 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 180, 0, 0.4));
        }

        @keyframes teamGradient {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }
        }

        @keyframes teamBlink {
            0%, 100% {
                opacity: 0.65;
            }

            50% {
                opacity: 1;
            }
        }

        /* TAMPILAN HP */
        @media (max-width: 600px) {
            .container {
                gap: 24px;
                padding: 30px 12px;
            }

            .main-title {
                font-size: clamp(20px, 5.5vw, 32px);
                letter-spacing: 0.5px;
                padding: 0 4px;
            }

            .countdown {
                gap: 9px;
            }

            .countdown-box {
                min-width: 42%;
                max-width: 160px;
                padding: 17px 8px;
            }

            .countdown-number {
                font-size: 36px;
            }

            .countdown-label {
                font-size: 11px;
                letter-spacing: 1px;
            }

            .team-title {
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="overlay"></div>
    <canvas id="fireworks"></canvas>

    <main class="container">
        <h1 class="main-title">HAPPY NEW YEAR 2027</h1>

        <section class="countdown" aria-label="Hitung mundur tahun baru">
            <div class="countdown-box">
                <span class="countdown-number" id="days">000</span>
                <span class="countdown-label">HARI</span>
            </div>

            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">JAM</span>
            </div>

            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">MENIT</span>
            </div>

            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">DETIK</span>
            </div>
        </section>

        <h2 class="team-title">TEAM ELITE FAMILY</h2>
    </main>

    <script>
        /* COUNTDOWN TAHUN BARU */
        const targetDate = new Date(
            "2027-01-01T00:00:00+07:00"
        ).getTime();

        function updateCountdown() {
            const distance = Math.max(0, targetDate - Date.now());

            const days = Math.floor(
                distance / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (distance % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (distance % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            const seconds = Math.floor(
                (distance % (1000 * 60)) / 1000
            );

            document.getElementById("days").textContent =
                String(days).padStart(3, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        /* ANIMASI KEMBANG API */
        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        let particles = [];
        let rockets = [];

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function launchRocket() {
            rockets.push({
                x: random(width * 0.12, width * 0.88),
                y: height + 5,
                targetY: random(height * 0.12, height * 0.52),
                speed: random(4, 7),
                hue: random(0, 360),
                trail: []
            });
        }

        function explode(x, y, hue) {
            const count = Math.floor(random(45, 85));

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = random(1, 5.5);

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: random(0.009, 0.018),
                    gravity: 0.035,
                    size: random(1, 3),
                    hue: hue + random(-25, 25)
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, width, height);

            for (let i = rockets.length - 1; i >= 0; i--) {
                const rocket = rockets[i];

                rocket.trail.push({
                    x: rocket.x,
                    y: rocket.y
                });

                if (rocket.trail.length > 7) {
                    rocket.trail.shift();
                }

                rocket.trail.forEach((point, j) => {
                    ctx.beginPath();
                    ctx.arc(
                        point.x,
                        point.y,
                        (j + 1) * 0.7,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        `hsla(${rocket.hue},100%,70%,${j / 10})`;

                    ctx.fill();
                });

                rocket.y -= rocket.speed;

                ctx.beginPath();
                ctx.arc(rocket.x, rocket.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${rocket.hue},100%,70%)`;
                ctx.fill();

                if (rocket.y <= rocket.targetY) {
                    explode(rocket.x, rocket.y, rocket.hue);
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];

                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.99;
                p.vy *= 0.99;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle =
                    `hsla(${p.hue},100%,65%,${p.alpha})`;
                ctx.fill();
            }

            requestAnimationFrame(animateFireworks);
        }

        function scheduleRocket() {
            launchRocket();
            setTimeout(scheduleRocket, random(1200, 2200));
        }

        scheduleRocket();
        animateFireworks();
    </script>
</body>
</html>
